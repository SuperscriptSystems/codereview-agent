name: Build and Push OpenCode Preview Image

on:
  push:
    branches:
      - create-new-reviewer-with-opencode

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: vars
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.opencode
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/codereviewagent-opencode:preview
            ${{ secrets.DOCKERHUB_USERNAME }}/codereviewagent-opencode:branch-create-new-reviewer-with-opencode
            ${{ secrets.DOCKERHUB_USERNAME }}/codereviewagent-opencode:sha-${{ steps.vars.outputs.short_sha }}
